# ===============================================================================
# GeoPulse Retail Mobility Analytics - Airflow Core Configuration
# ===============================================================================

[core]
# The home directory for Airflow
airflow_home = ./airflow

# The folder where your airflow pipelines (DAGs) live
dags_folder = ./airflow/dags

# The folder where Airflow custom plugins live
plugins_folder = ./airflow/plugins

# The executor to run tasks. LocalExecutor allows parallel execution locally
executor = LocalExecutor

# Do not load example DAGs shipped with Airflow
load_examples = False

# Do not load default connection templates
load_default_connections = False

# Default timezone for scheduling and execution
default_timezone = utc

# Pause DAGs upon initial creation
dags_are_paused_at_creation = True

# Maximum active task instances per DAG
max_active_tasks_per_dag = 16

# Maximum active DAG runs per DAG
max_active_runs_per_dag = 1

# Default file task handler
task_runner = StandardTaskRunner

# Enable XCom pickling safety
enable_xcom_pickling = False

[database]
# The SQLAlchemy connection string to the metadata database
sql_alchemy_conn = sqlite:///./airflow/airflow.db

# Database pool configuration
sql_alchemy_pool_size = 5
sql_alchemy_max_overflow = 10
sql_alchemy_pool_recycle = 1800

[logging]
# The folder where Airflow logs are stored
base_log_folder = ./airflow/logs

# Logging level
logging_level = INFO

# Log format with timestamp and module details
log_format = [%%(asctime)s] {%%(filename)s:%%(lineno)d} %%(levelname)s - %%(message)s
simple_log_format = %%(asctime)s %%(levelname)s - %%(message)s

# Delete worker logs older than retention period (days)
log_file_retention_days = 30

[webserver]
# Webserver host and port
base_url = http://localhost:8080
web_server_host = 0.0.0.0
web_server_port = 8080

# Web UI security and appearance
secret_key = geopulse_mobility_airflow_secret_key_prod_salt_2026
expose_config = True
dag_default_view = grid
default_ui_timezone = UTC
reload_on_plugin_change = True

# Session lifetime in minutes
session_lifetime_minutes = 43200

[scheduler]
# Job and scheduler heartbeat intervals in seconds
job_heartbeat_sec = 5
scheduler_heartbeat_sec = 5

# Frequency of scanning and parsing DAG files
min_file_process_interval = 10
dag_dir_list_interval = 30

# Parallel parser processes
parsing_processes = 2

# Catchup defaults
catchup_by_default = False

[operators]
# Default owner assigned to newly created tasks
default_owner = DataPlatformTeam

[metrics]
# StatsD / Prometheus metrics export configuration
statsd_on = False
statsd_host = localhost
statsd_port = 8125
statsd_prefix = airflow
